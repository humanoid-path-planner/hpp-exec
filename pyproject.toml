[project]
name = "hpp-exec"
version = "0.1.0"
description = "ROS2 execution utilities for HPP-generated trajectories"
readme = "README.md"
license = "BSD-2-Clause"
authors = [
  {name = "Florent Lamiraux"},
  {name = "Paul Saurdin"}
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Robotics"
]
keywords = ["robotics", "motion-planning", "hpp", "manipulation"]
dependencies = [
  "hpp-python"
]

[project.optional-dependencies]
viewer = ["viser"]
dev = [
  "pytest",
  "pytest-cov",
  "ruff"
]

[project.urls]
Homepage = "https://github.com/humanoid-path-planner"
Documentation = "https://humanoid-path-planner.github.io/hpp-doc/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
